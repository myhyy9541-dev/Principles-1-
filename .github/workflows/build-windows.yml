name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
      - run: npm run build:portable
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fursan-lan-windows-setup
          path: release/Fursan-Lan-Setup-0.4.1-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: fursan-lan-windows-portable
          path: release/Fursan-Lan-Portable-0.4.1-x64.exe
          if-no-files-found: error
          retention-days: 30
