name: Build Wasel Java for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "java-app/**"
      - ".github/workflows/build-windows.yml"
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-app/pom.xml
      - name: Install WiX Toolset for jpackage
        shell: pwsh
        run: |
          $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) {
            choco install wixtoolset --yes --no-progress
            $candle = Get-ChildItem -Path "${env:ProgramFiles(x86)}\WiX Toolset v*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $candle) { throw "WiX Toolset candle.exe was not found." }
          $wixBin = $candle.Directory.FullName
          if (-not (Test-Path (Join-Path $wixBin "light.exe"))) { throw "WiX light.exe was not found beside candle.exe." }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Test and package Java application
        working-directory: java-app
        run: mvn --batch-mode --no-transfer-progress clean test package
      - name: Stage runtime and JCEF dependencies
        shell: pwsh
        working-directory: java-app
        run: |
          New-Item -ItemType Directory -Force -Path target\installer-input | Out-Null
          Copy-Item target\wasel-java-0.4.0.jar target\installer-input\
          Copy-Item target\app-libs\*.jar target\installer-input\
          $count = (Get-ChildItem target\installer-input -Filter *.jar).Count
          if ($count -lt 10) { throw "Dependency bundle is incomplete: only $count jars were staged." }
          Write-Host "Staged $count application/runtime jars."
      - name: Create portable Windows application image
        shell: pwsh
        working-directory: java-app
        run: |
          jpackage --type app-image --name Wasel-LAN --input target\installer-input --dest target\dist --main-jar wasel-java-0.4.0.jar --main-class com.wasel.WaselApplication --app-version 0.4.0 --vendor "Wasel" --description "Arabic offline LAN messaging" --icon src\main\resources\windows\wasel.ico
          Compress-Archive -Path target\dist\Wasel-LAN\* -DestinationPath target\dist\Wasel-LAN-0.4.0-portable.zip -CompressionLevel Optimal
      - name: Create per-user Windows installer
        shell: pwsh
        working-directory: java-app
        run: |
          jpackage --type exe --name Wasel-LAN --input target\installer-input --dest target\dist --main-jar wasel-java-0.4.0.jar --main-class com.wasel.WaselApplication --app-version 0.4.0 --vendor "Wasel" --description "Arabic offline LAN messaging" --icon src\main\resources\windows\wasel.ico --win-per-user-install --win-dir-chooser --win-menu --win-shortcut
          if (-not (Test-Path target\dist\Wasel-LAN-0.4.0.exe)) { throw "Windows installer EXE was not produced." }
      - uses: actions/upload-artifact@v7
        with:
          name: wasel-java-windows-0.4.0
          path: |
            java-app/target/dist/Wasel-LAN-0.4.0.exe
            java-app/target/dist/Wasel-LAN-0.4.0-portable.zip
          if-no-files-found: error
          retention-days: 30
