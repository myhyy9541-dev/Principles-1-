plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fursan.lan.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fursan.lan.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/fursanWebAssets'))
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    testImplementation 'junit:junit:4.13.2'
}

def repoRoot = rootProject.projectDir.parentFile
def webAssetOutput = layout.buildDirectory.dir('generated/fursanWebAssets')
tasks.register('prepareFursanWebAssets') {
    inputs.files(
        new File(repoRoot, 'src/index.html'),
        new File(repoRoot, 'src/style.css'),
        new File(repoRoot, 'src/renderer.js'),
        new File(repoRoot, 'node_modules/socket.io-client/dist/socket.io.js'),
        new File(projectDir, 'src/main/assets/android-adapter.js')
    )
    outputs.dir(webAssetOutput)
    doLast {
        File output = webAssetOutput.get().asFile
        output.mkdirs()
        new File(output, 'style.css').bytes = new File(repoRoot, 'src/style.css').bytes
        new File(output, 'renderer.js').bytes = new File(repoRoot, 'src/renderer.js').bytes
        new File(output, 'socket.io.js').bytes = new File(repoRoot, 'node_modules/socket.io-client/dist/socket.io.js').bytes
        new File(output, 'android-adapter.js').bytes = new File(projectDir, 'src/main/assets/android-adapter.js').bytes
        String html = new File(repoRoot, 'src/index.html').getText('UTF-8')
        html = html.replace('../node_modules/socket.io-client/dist/socket.io.js', 'socket.io.js')
        html = html.replace('<script src="renderer.js"></script>', '<script src="android-adapter.js"></script>\n  <script src="renderer.js"></script>')
        new File(output, 'index.html').setText(html, 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn('prepareFursanWebAssets') }
